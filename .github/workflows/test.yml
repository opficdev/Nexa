name: Test

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

concurrency:
  group: test-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    name: Swift Test
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Swift Version
        run: swift --version

      - name: Test
        working-directory: Nexa
        run: swift test

  notify_pr_failure:
    name: Notify PR Failure (Test)
    needs: test
    if: ${{ always() && needs.test.result == 'failure' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment on Failed PR
        uses: actions/github-script@v7
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const pullRequest = workflowRun.pull_requests && workflowRun.pull_requests[0];
            if (!pullRequest) {
              core.info('No PR context; skipping comment.');
              return;
            }
            const body = [
              `@${workflowRun.actor.login} test CI가 실패했습니다.`,
              '',
              `- Workflow: ${context.workflow}`,
              `- Branch: ${workflowRun.head_branch}`,
              `- Commit: ${workflowRun.head_sha}`,
              `- Upstream Run: ${workflowRun.html_url}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              body,
            });

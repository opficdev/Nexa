name: Test

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      pr_actor:
        required: true
        type: string
      pr_head_ref:
        required: true
        type: string
      pr_head_sha:
        required: true
        type: string

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    name: Swift Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_head_sha }}

      - name: Swift Version
        run: swift --version

      - name: Test
        working-directory: Nexa
        run: swift test

  notify_pr_failure:
    name: Notify PR Failure (Test)
    needs: test
    if: ${{ always() && needs.test.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment on Failed PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              `@${{ inputs.pr_actor }} test CI가 실패했습니다.`,
              '',
              `- Workflow: ${context.workflow}`,
              `- Branch: ${{ inputs.pr_head_ref }}`,
              `- Commit: ${{ inputs.pr_head_sha }}`,
              `- Run: ${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body,
            });

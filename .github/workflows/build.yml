name: Build

on:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    name: Swift Build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift Version
        run: swift --version

      - name: Build
        working-directory: Nexa
        run: swift build

  test:
    name: Swift Test
    needs: build
    if: ${{ needs.build.result == 'success' }}
    uses: ./.github/workflows/test.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_actor: ${{ github.actor }}
      pr_head_ref: ${{ github.event.pull_request.head.ref }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}

  notify_pr_failure:
    name: Notify PR Failure (Build)
    needs: build
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment on Failed PR
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              core.info('No PR context; skipping comment.');
              return;
            }
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              `@${context.actor} build CI가 실패했습니다.`,
              '',
              `- Workflow: ${context.workflow}`,
              `- Branch: ${pullRequest.head.ref}`,
              `- Commit: ${pullRequest.head.sha}`,
              `- Run: ${runUrl}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              body,
            });
